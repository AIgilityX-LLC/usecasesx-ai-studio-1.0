name: Production deploy

# Production ships ONLY with explicit human authorization:
#   1. workflow_dispatch (manual)
#   2. confirm input must equal exactly: deploy-production
#   3. GitHub Environment "production" with required reviewers enabled
#
# See docs/cicd/production-authorization.md

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (e.g. v1.2.0). Leave empty to deploy the selected ref SHA."
        required: false
        type: string
      confirm:
        description: 'Type exactly "deploy-production" to authorize'
        required: true
        type: string
      reason:
        description: "Why this production deploy is authorized (ticket / change ID)"
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    name: Explicit authorization gate
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation phrase
        run: |
          if [ "${{ inputs.confirm }}" != "deploy-production" ]; then
            echo "::error::Production deploy refused — confirmation phrase mismatch."
            echo "Expected: deploy-production"
            exit 1
          fi
          echo "Authorized reason: ${{ inputs.reason }}"
          echo "Requested tag: ${{ inputs.tag || '(ref SHA)' }}"

  deploy:
    name: Build & deploy to production
    needs: [authorize]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VITE_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.PRODUCTION_SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
      LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
      APP_ENV: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Verify required env vars
        run: node scripts/verify-deploy-env.mjs production
      - name: Build
        run: bun run build
      - name: Deploy
        id: deploy
        run: node scripts/deploy-environment.mjs production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Production smoke
        run: bunx playwright install --with-deps chromium && bun run test:smoke
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
      - name: Upload production build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.run_id }}
          path: |
            dist/**
            .output/**
          retention-days: 30
          if-no-files-found: ignore
