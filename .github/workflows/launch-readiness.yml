name: Launch readiness

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: launch-readiness-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"

jobs:
  integration-gate:
    name: P0 integration suites (service role)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SMOKE_DEMO_EMAIL: ${{ secrets.SMOKE_DEMO_EMAIL }}
      SMOKE_DEMO_PASSWORD: ${{ secrets.SMOKE_DEMO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Prepare test-mode env
        run: node scripts/ci-test-env.mjs
      - name: Verify route tree
        run: bun run verify:routes
      # Backend-backed suites need real credentials. On forks/PRs without
      # secrets we skip them instead of failing the pipeline; the CI workflow
      # still enforces lint, typecheck, build and Playwright UI specs.
      - name: Detect backend credentials
        id: creds
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Backend credentials not configured — skipping launch-readiness integration suites."
          fi
      - name: Run integration suites (fails the build on any regression)
        if: steps.creds.outputs.available == 'true'
        run: bun run test:integration 2>&1 | tee launch-e2e.log
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-integration
          path: |
            launch-e2e.log
            test-evidence/integration/**
            test-results/**
          retention-days: 14
          if-no-files-found: ignore

  browser-p0-gate:
    name: P0 browser journeys (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SMOKE_DEMO_EMAIL: ${{ secrets.SMOKE_DEMO_EMAIL }}
      SMOKE_DEMO_PASSWORD: ${{ secrets.SMOKE_DEMO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Prepare test-mode env
        run: node scripts/ci-test-env.mjs
      - name: Run P0 browser journeys
        run: bun run test:p0 2>&1 | tee playwright-p0.log
      # Traces, screenshots, videos and the HTML report are configured in
      # playwright.config.ts (retain-on-failure) so every failed gate ships
      # reviewable evidence.
      - name: Upload browser evidence (report, screenshots, videos, traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-browser-p0
          path: |
            playwright-p0.log
            playwright-report/**
            test-results/**
          retention-days: 14
          if-no-files-found: ignore
