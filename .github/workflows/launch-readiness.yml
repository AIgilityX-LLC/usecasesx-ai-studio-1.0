name: Launch readiness

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: launch-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-e2e:
    name: Full E2E launch gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SMOKE_DEMO_EMAIL: ${{ secrets.SMOKE_DEMO_EMAIL }}
      SMOKE_DEMO_PASSWORD: ${{ secrets.SMOKE_DEMO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Prepare test-mode env
        run: node scripts/ci-test-env.mjs
      - name: Verify route tree
        run: bun run verify:routes
      # Backend-backed suites need real credentials. On forks/PRs without
      # secrets we skip them instead of failing the pipeline; the CI workflow
      # still enforces lint, typecheck, build and Playwright UI specs.
      - name: Detect backend credentials
        id: creds
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Backend credentials not configured — skipping launch-readiness E2E suites."
          fi
      - name: Run all launch-readiness E2E suites
        if: steps.creds.outputs.available == 'true'
        run: bun run test:e2e 2>&1 | tee launch-e2e.log
      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-readiness-logs
          path: |
            launch-e2e.log
            test-results/**
          retention-days: 7
          if-no-files-found: ignore
