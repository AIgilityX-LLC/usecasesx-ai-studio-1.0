name: Staging deploy

# Ships the app to the staging environment after CI passes on main.
# CI is the gate: if lint/typecheck/build/unit/Playwright fail, this never runs.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to staging
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    env:
      # Client-visible build inputs.
      VITE_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.STAGING_SUPABASE_PROJECT_ID }}
      # Server-only inputs, injected at deploy time.
      SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
      APP_ENV: staging
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Verify required env vars
        run: node scripts/verify-deploy-env.mjs staging
      - name: Build
        run: bun run build
      - name: Deploy
        id: deploy
        run: node scripts/deploy-environment.mjs staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke the deployed environment
        run: bunx playwright install --with-deps chromium && bun run test:smoke
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.url }}
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-build
          path: |
            dist/**
            .output/**
          retention-days: 7
          if-no-files-found: ignore
