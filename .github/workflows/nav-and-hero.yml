name: Nav integrity + navbar/hero E2E

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/navbar.spec.ts"
      - "scripts/check-nav-integrity.mjs"
      - "playwright.config.ts"
      - ".github/workflows/nav-and-hero.yml"
  push:
    branches: [main]

concurrency:
  group: nav-and-hero-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nav-and-hero:
    name: Nav integrity + hero/navbar Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Prepare test-mode env
        run: node scripts/ci-test-env.mjs
      - name: Verify route tree
        run: bun run verify:routes
      - name: Nav-integrity check (top nav + sidebar targets)
        run: bun run check:nav-integrity
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run navbar + hero-tone Playwright suite
        run: bun run test:navbar 2>&1 | tee navbar-run.log
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navbar-playwright-diagnostics
          path: |
            playwright-report/**
            test-results/**
            navbar-run.log
          retention-days: 7
          if-no-files-found: ignore
